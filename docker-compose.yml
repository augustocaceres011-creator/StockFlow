services:
  stockflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - stockflow_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/stockflow.db
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/estadisticas')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  stockflow_data:
    driver: local
