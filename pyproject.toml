[tool.poetry]
name = "stockflow"
version = "0.1.0"
description = "Sistema de gestión de inventario con API REST y Frontend"
authors = ["Henrr <estudiante@stockflow.local>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = ">=0.111.0,<0.112.0"
uvicorn = {extras = ["standard"], version = ">=0.30.0,<0.31.0"}
pydantic = ">=2.7.0,<3.0.0"
pydantic-settings = ">=2.3.0,<3.0.0"
sqlalchemy = ">=2.0.30,<2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0,<9.0.0"
httpx = ">=0.27.0,<0.28.0"
black = ">=24.4.0,<25.0.0"
flake8 = ">=7.0.0,<8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
